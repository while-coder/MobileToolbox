[package]
name = "mobiletoolbox"
version = "0.1.0"
description = "MobileToolbox - 移动应用与设备工具箱"
authors = ["whilecode"]
edition = "2021"
rust-version = "1.93"

[lib]
name = "mobiletoolbox_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
apk-info = "1.0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
sha2 = "0.10"
base64 = "0.22"
hex = "0.4"

# 桌面端更新与重启（移动端不使用应用内更新）
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
