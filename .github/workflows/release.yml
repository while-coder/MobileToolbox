name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      notes: ${{ steps.release.outputs.notes }}
    steps:
      - uses: actions/checkout@v5

      - id: release
        uses: while-coder/workflows/.github/actions/resolve-release-info@main
        with:
          tag-prefix: v
          package-json: package.json
          changelog: CHANGELOG.md

  prepare-release:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - name: Recreate GitHub Release
        uses: while-coder/workflows/.github/actions/recreate-github-release@main
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ needs.check.outputs.tag }}
          target: ${{ github.sha }}
          title: MobileToolbox v${{ needs.check.outputs.version }}
          notes: ${{ needs.check.outputs.notes }}

  desktop:
    needs: [check, prepare-release]
    uses: while-coder/workflows/.github/workflows/tauri-desktop-release.yml@main
    with:
      project-path: apps/app
      cargo-lock-path: apps/app/src-tauri/Cargo.lock
      cargo-target-path: apps/app/src-tauri/target
      tag-name: ${{ needs.check.outputs.tag }}
      release-name: MobileToolbox v${{ needs.check.outputs.version }}
      release-body: ${{ needs.check.outputs.notes }}
      release-owner: while-coder
      release-repo: MobileToolbox
    secrets: inherit

  publish-manifest:
    needs: [check, desktop]
    if: ${{ !cancelled() && needs.desktop.result == 'success' }}
    uses: while-coder/workflows/.github/workflows/tauri-updater-manifest.yml@main
    with:
      product-prefix: MobileToolbox
      tag-name: ${{ needs.check.outputs.tag }}
      version: ${{ needs.check.outputs.version }}
      release-notes: ${{ needs.check.outputs.notes }}
      release-repository: while-coder/MobileToolbox
    secrets: inherit